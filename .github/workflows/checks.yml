name: Check website

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Reuse successful PR checks
        id: pr-checks
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            if (context.payload.forced || context.payload.created) return true

            try {
              const pulls = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { ...context.repo, commit_sha: context.sha, per_page: 100 },
              )
              const pr = pulls.find((pr) =>
                pr.merged_at &&
                pr.base.ref === 'main' &&
                pr.base.repo.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                pr.merge_commit_sha === context.sha
              )
              if (!pr) return true

              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: 'checks.yml',
                event: 'pull_request',
                head_sha: pr.head.sha,
                per_page: 1,
              })
              const run = data.workflow_runs[0]
              if (run?.head_sha !== pr.head.sha || run.status !== 'completed' || run.conclusion !== 'success') {
                return true
              }

              core.info(`Reusing successful PR #${pr.number} checks: ${run.html_url}`)
              return false
            } catch (error) {
              core.warning(`Could not verify prior PR checks; running checks: ${error.message}`)
              return true
            }
      - name: Checkout
        if: steps.pr-checks.outputs.result != 'false'
        uses: actions/checkout@v7
      - name: Setup Node
        if: steps.pr-checks.outputs.result != 'false'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        if: steps.pr-checks.outputs.result != 'false'
        run: npm ci
      - name: Check formatting
        if: steps.pr-checks.outputs.result != 'false'
        run: npm run format:check
      - name: Lint
        if: steps.pr-checks.outputs.result != 'false'
        run: npm run lint
      - name: Typecheck
        if: steps.pr-checks.outputs.result != 'false'
        run: npm run typecheck
      - name: Build static site
        if: steps.pr-checks.outputs.result != 'false'
        run: npm run build
      - name: Smoke test static export
        if: steps.pr-checks.outputs.result != 'false'
        run: npm run smoke
